<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESOTEC - Historial de Tickets</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/TecHistorialTickets.css">
    <link rel="stylesheet" href="../css/user-menu.css">
    <link rel="stylesheet" href="../css/notifications.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="header-logo-block">
                <img src="../images/icon_gesotec.png" alt="Logo">
            </div>
            <div class="header-title-block">
                <h1>Gestión de Soporte Tecnológico</h1>
            </div>
        </header>

        <div class="app-body">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="TecPerfil.html" class="nav-item">
                        <span class="nav-icon">🏠</span> Panel de Control
                    </a>
                    <a href="TecMisTickets.html" class="nav-item">
                        <span class="nav-icon">📇</span> Tickets Asignados
                    </a>
                    <a href="TecBaseConocimiento.html" class="nav-item">
                        <span class="nav-icon">📚</span> Base de Conocimiento
                    </a>
                    <a href="TecVerPerfil.html" class="nav-item">
                        <span class="nav-icon">👤</span> Ver Perfil
                    </a>
                    <a href="TecHistorialTickets.html" class="nav-item active">
                        <span class="nav-icon">🕙</span> Historial de Tickets
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <div class="user-pill">
                        <div class="user-avatar">👤</div>
                        <div class="user-meta">
                            <p>Técnico de Soporte</p>
                            <a href="TecVerPerfil.html" class="profile-link">Ver Perfil</a>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="main-content">
                <div class="history-container-box">
                    <h2 class="page-title">Historial de Tickets</h2>

                    <section class="filters-bar">
                        <div class="filter-item">
                            <label>Filtrar por Estado</label>
                            <select id="filterEstado">
                                <option value="Todos">Todos</option>
                                <option value="Cerrado">Cerrado</option>
                                <option value="Resuelto">Resuelto</option>
                                <option value="Cancelado">Cancelado</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>Filtrar por Prioridad</label>
                            <select id="filterPrioridad">
                                <option value="Todas">Todas</option>
                                <option value="Urgente">Urgente</option>
                                <option value="Alta">Alta</option>
                                <option value="Media">Media</option>
                                <option value="Baja">Baja</option>
                            </select>
                        </div>
                        <button class="btn-filter-action" id="btnFiltrar">Filtrar</button>
                    </section>

                    <div class="table-responsive">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>ASUNTO</th>
                                    <th>USUARIO</th>
                                    <th>PRIORIDAD</th>
                                    <th>ESTADO FINAL</th>
                                    <th>FECHA CIERRE</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <!-- Los tickets se cargarán dinámicamente desde el backend -->
                            </tbody>
                        </table>
                    </div>

                    <footer class="table-footer">
                        <p>Mostrar 1 a 4 de 215 resultados</p>
                        <div class="pagination-btns">
                            <button class="btn-pag">Anterior</button>
                            <button class="btn-pag">Siguiente</button>
                        </div>
                    </footer>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal de Detalles del Ticket -->
    <div id="ticketModal" class="ticket-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalles del Ticket</h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <label>ID del Ticket:</label>
                    <span id="modalTicketId"></span>
                </div>
                <div class="detail-row">
                    <label>Asunto:</label>
                    <span id="modalAsunto"></span>
                </div>
                <div class="detail-row">
                    <label>Descripción:</label>
                    <p id="modalDescripcion"></p>
                </div>
                <div class="detail-row">
                    <label>Prioridad:</label>
                    <span id="modalPrioridad"></span>
                </div>
                <div class="detail-row">
                    <label>Estado:</label>
                    <span id="modalEstado"></span>
                </div>
                <div class="detail-row">
                    <label>Fecha de Creación:</label>
                    <span id="modalFechaCreacion"></span>
                </div>
                <div class="detail-row">
                    <label>Última Actualización:</label>
                    <span id="modalFechaActualizacion"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/TecHistorialTickets.js"></script>
</body>
</html>
