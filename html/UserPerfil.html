<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESOTEC - Perfil Usuario</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/UserPerfil.css">
    <link rel="stylesheet" href="../css/user-menu.css">
</head>
<body>
    <div class="app-container">
        
        <header class="main-header">
            <div class="header-logo-block">
                <img src="../images/icon_gesotec.png" alt="Logo">
            </div>
            <div class="header-title-block">
                <h1>Gestión de Soporte Tecnológico</h1>
            </div>
        </header>

        <div class="app-body">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="#" class="nav-item active">
                        <span class="nav-icon">🏠</span> Panel de Control
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <div class="user-pill">
                        <div class="user-avatar">👤</div>
                        <div class="user-meta">
                            <p class="role-label">Usuario</p>
                            <a href="UserVerPerfil.html" class="profile-link">Ver Perfil</a>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="main-content">
                <section class="user-info-card">
                    <div class="info-header">
                        <div class="big-avatar">👤</div>
                        <h2 class="role-name">Usuario</h2>
                        <div class="data-display-box">
                            <p><strong>Nombre:</strong> <span id="displayNombre"></span></p>
                            <p><strong>Correo:</strong> <span id="displayCorreo"></span></p>
                        </div>
                        <div class="logout-group">
                            <div class="user-menu-container" id="userMenu">
                                <div class="user-avatar-button" id="userAvatarBtn">
                                    <div class="user-avatar-circle" id="userInitials">U">
                                        <span class="notification-badge hidden" id="notificationBadge">0</span>
                                    </div>
                                    <div class="user-info-display">
                                        <span class="user-name-display" id="userName">Usuario</span>
                                        <span class="user-role-display">Usuario</span>
                                    </div>
                                    <svg class="dropdown-arrow" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M5 8L10 13L15 8" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                                <div class="user-menu-dropdown" id="userDropdown">
                                    <a href="UserVerPerfil.html" class="user-menu-item">
                                        <svg class="user-menu-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="#666"/>
                                        </svg>
                                        <span class="user-menu-text">Perfil</span>
                                    </a>
                                    <a href="#" class="user-menu-item danger" id="logoutBtn">
                                        <svg class="user-menu-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M17 7L15.59 8.41L18.17 11H9V13H18.17L15.59 15.58L17 17L22 12L17 7ZM4 5H12V3H4C2.9 3 2 3.9 2 5V19C2 20.1 2.9 21 4 21H12V19H4V5Z" fill="#d32f2f"/>
                                        </svg>
                                        <span class="user-menu-text">Cerrar Sesión</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="dashboard-grid">
                    <div class="panel-box">
                        <h3>Mis Ticket Activados</h3>
                        <div id="ticketsContainer">
                            <!-- Los tickets se cargarán dinámicamente desde el backend -->
                        </div>
                    </div>

                    <div class="panel-box">
                        <h3>Acciones Rápidos</h3>
                        <a href="UserCrearTicket.html" class="btn-action btn-blue">Crear Nuevo Ticket</a>
                        <a href="UserHistorialTickets.html" class="btn-action btn-gray">Ver Historial de Tickets</a>
                        <a href="UserVerPerfil.html" class="btn-action btn-light-green">Ver Perfil</a>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
    <script src="../js/UserPerfil.js"></script>
</html>
