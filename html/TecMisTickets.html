<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESOTEC - Mis Tickets Asignados</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/TecMisTickets.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="header-logo-block">
                <img src="../images/icon_gesotec.png" alt="Logo">
            </div>
            <div class="header-title-block">
                <h1>Gestión de Soporte Tecnológico</h1>
            </div>
        </header>

        <div class="app-body">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="TecPerfil.html" class="nav-item active">
                        <div class="grid-icon">
                            <div></div><div></div><div></div><div></div>
                        </div>
                        Panel de Control
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <div class="user-pill">
                        <div class="user-avatar">👤</div>
                        <div class="user-meta">
                            <p>Técnico de Soporte</p>
                            <a href="TecVerPerfil.html" class="profile-link">Ver Perfil</a>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="main-content">
                <div class="tickets-container-box">
                    <h2 class="page-title">Mis Tickets Asignados</h2>

                    <section class="filters-bar">
                        <div class="filter-item">
                            <label>Filtrar por Estado</label>
                            <select id="filterEstado">
                                <option value="Todos">Todos</option>
                                <option value="Abierto">Abierto</option>
                                <option value="En Progreso">En Progreso</option>
                                <option value="Cerrado">Cerrado</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>Filtrar por Prioridad</label>
                            <select id="filterPrioridad">
                                <option value="Todas">Todas</option>
                                <option value="Urgente">Urgente</option>
                                <option value="Alta">Alta</option>
                                <option value="Media">Media</option>
                                <option value="Baja">Baja</option>
                            </select>
                        </div>
                        <button class="btn-filter-action" id="btnFiltrar">Filtrar</button>
                    </section>

                    <div class="table-responsive">
                        <table class="tickets-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>ASUNTO</th>
                                    <th>USUARIO</th>
                                    <th>PRIORIDAD</th>
                                    <th>ESTADO</th>
                                    <th>FECHA CREACIÓN</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <!-- Los tickets se cargarán dinámicamente desde el backend -->
                            </tbody>
                        </table>
                    </div>

                    <footer class="table-footer">
                        <p>Mostrar 1 a 4 de 4 resultados</p>
                        <div class="pagination-btns">
                            <button class="btn-pag">Anterior</button>
                            <button class="btn-pag">Siguiente</button>
                        </div>
                    </footer>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal de Detalles del Ticket -->
    <div id="ticketModal" class="ticket-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalles del Ticket</h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <label>ID del Ticket:</label>
                    <span id="modalTicketId"></span>
                </div>
                <div class="detail-row">
                    <label>Asunto:</label>
                    <span id="modalAsunto"></span>
                </div>
                <div class="detail-row">
                    <label>Descripción:</label>
                    <p id="modalDescripcion"></p>
                </div>
                <div class="detail-row">
                    <label>Prioridad:</label>
                    <span id="modalPrioridad"></span>
                </div>
                <div class="detail-row">
                    <label>Estado Actual:</label>
                    <span id="modalEstado"></span>
                </div>
                <div class="detail-row">
                    <label for="nuevoEstado">Cambiar Estado:</label>
                    <select id="nuevoEstado">
                        <option value="Abierto">Abierto</option>
                        <option value="En Progreso">En Progreso</option>
                        <option value="Resuelto">Resuelto</option>
                        <option value="Cerrado">Cerrado</option>
                    </select>
                </div>
                <div class="detail-row">
                    <label>Fecha de Creación:</label>
                    <span id="modalFechaCreacion"></span>
                </div>
                <div class="detail-row">
                    <label>Última Actualización:</label>
                    <span id="modalFechaActualizacion"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="btnCancelar">Cancelar</button>
                <button class="btn-save" id="btnGuardarEstado">Guardar Cambio</button>
            </div>
        </div>
    </div>

    <script src="../js/TecMisTickets.js"></script>
</body>
</html>
