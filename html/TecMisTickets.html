<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESOTEC - Mis Tickets Asignados</title>
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/TecMisTickets.css">
    <link rel="stylesheet" href="../css/user-menu.css">
    <link rel="stylesheet" href="../css/notifications.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="header-logo-block">
                <img src="../images/icon_gesotec.png" alt="Logo">
            </div>
            <div class="header-title-block">
                <h1>Gestión de Soporte Tecnológico</h1>
            </div>
            <div class="header-user-menu">
                <div class="user-menu-container" id="userMenu">
                    <div class="user-avatar-button" id="userAvatarBtn">
                        <div class="user-avatar-circle" id="userInitials">T">
                            <span class="notification-badge hidden" id="notificationBadge">0</span>
                        </div>
                        <div class="user-info-display">
                            <span class="user-name-display" id="userName">Técnico</span>
                            <span class="user-role-display">Técnico</span>
                        </div>
                        <svg class="dropdown-arrow" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 8L10 13L15 8" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="user-menu-dropdown" id="userDropdown">
                        <a href="TecVerPerfil.html" class="user-menu-item">
                            <svg class="user-menu-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="#666"/>
                            </svg>
                            <span class="user-menu-text">Perfil</span>
                        </a>
                        <a href="#" class="user-menu-item danger" id="logoutBtn">
                            <svg class="user-menu-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M17 7L15.59 8.41L18.17 11H9V13H18.17L15.59 15.58L17 17L22 12L17 7ZM4 5H12V3H4C2.9 3 2 3.9 2 5V19C2 20.1 2.9 21 4 21H12V19H4V5Z" fill="#d32f2f"/>
                            </svg>
                            <span class="user-menu-text">Cerrar Sesión</span>
                        </a>
                    </div>
                    <div class="notifications-dropdown" id="notificationsDropdown">
                        <div class="notifications-header">
                            <h3>Notificaciones</h3>
                            <button class="mark-all-read-btn" id="markAllReadBtn">Marcar todas como leídas</button>
                        </div>
                        <div class="notifications-list" id="notificationsList">
                            <!-- Las notificaciones se cargarán dinámicamente -->
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="app-body">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="TecPerfil.html" class="nav-item active">
                        <div class="grid-icon">
                            <div></div><div></div><div></div><div></div>
                        </div>
                        Panel de Control
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <div class="user-pill">
                        <div class="user-avatar">👤</div>
                        <div class="user-meta">
                            <p>Técnico de Soporte</p>
                            <a href="TecVerPerfil.html" class="profile-link">Ver Perfil</a>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="main-content">
                <div class="tickets-container-box">
                    <h2 class="page-title">Mis Tickets Asignados</h2>

                    <section class="filters-bar">
                        <div class="filter-item">
                            <label>Filtrar por Estado</label>
                            <select id="filterEstado">
                                <option value="Todos">Todos</option>
                                <option value="Abierto">Abierto</option>
                                <option value="En Progreso">En Progreso</option>
                                <option value="Cerrado">Cerrado</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label>Filtrar por Prioridad</label>
                            <select id="filterPrioridad">
                                <option value="Todas">Todas</option>
                                <option value="Urgente">Urgente</option>
                                <option value="Alta">Alta</option>
                                <option value="Media">Media</option>
                                <option value="Baja">Baja</option>
                            </select>
                        </div>
                        <button class="btn-filter-action" id="btnFiltrar">Filtrar</button>
                    </section>

                    <div class="table-responsive">
                        <table class="tickets-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>ASUNTO</th>
                                    <th>USUARIO</th>
                                    <th>PRIORIDAD</th>
                                    <th>ESTADO</th>
                                    <th>FECHA CREACIÓN</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <!-- Los tickets se cargarán dinámicamente desde el backend -->
                            </tbody>
                        </table>
                    </div>

                    <footer class="table-footer">
                        <p>Mostrar 1 a 4 de 4 resultados</p>
                        <div class="pagination-btns">
                            <button class="btn-pag">Anterior</button>
                            <button class="btn-pag">Siguiente</button>
                        </div>
                    </footer>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal de Detalles del Ticket -->
    <div id="ticketModal" class="ticket-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalles del Ticket</h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <label>ID del Ticket:</label>
                    <span id="modalTicketId"></span>
                </div>
                <div class="detail-row">
                    <label>Asunto:</label>
                    <span id="modalAsunto"></span>
                </div>
                <div class="detail-row">
                    <label>Descripción:</label>
                    <p id="modalDescripcion"></p>
                </div>
                <div class="detail-row">
                    <label>Prioridad:</label>
                    <span id="modalPrioridad"></span>
                </div>
                <div class="detail-row">
                    <label>Estado:</label>
                    <span id="modalEstado"></span>
                </div>
                <div class="detail-row">
                    <label>Cambiar Estado:</label>
                    <select id="modalNuevoEstado">
                        <option value="">-- Seleccionar nuevo estado --</option>
                        <option value="Abierto">Abierto</option>
                        <option value="En Progreso">En Progreso</option>
                        <option value="Resuelto">Resuelto</option>
                        <option value="Cerrado">Cerrado</option>
                    </select>
                </div>
                <div class="detail-row">
                    <label>Fecha de Creación:</label>
                    <span id="modalFechaCreacion"></span>
                </div>
                <div class="detail-row">
                    <label>Última Actualización:</label>
                    <span id="modalFechaActualizacion"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelarCambio">Cancelar</button>
                <button class="btn-save" id="guardarEstado">Guardar Cambio</button>
            </div>
        </div>
    </div>

    <script src="../js/TecMisTickets.js"></script>
</body>
</html>
